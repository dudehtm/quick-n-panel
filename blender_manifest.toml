schema_version = "1.0.0"

id = "quick_n_panel"
version = "1.1.0"
name = "Quick N-panel"
tagline = "Open add-on tabs quickly from the 3D View N-panel"
maintainer = "Dudehtm"
type = "add-on"
tags = ["User Interface"]

blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later", "SPDX:CC0-1.0"]
copyright = ["2026 Dudehtm"]
website = "https://github.com/dudehtm/quick-n-panel"

[permissions]
files = "Store settings, import icons, and export configuration"

[build]
paths_exclude_pattern = [
  "/.git/",
  "/.github/",
  "/.gitattributes",
  "/.gitignore",
  "/.pytest_cache/",
  "/.ruff_cache/",
  "/__pycache__/",
  "**/__pycache__/",
  "**/*.pyc",
  "/tests/",
  "/AGENT.md",
  "/MULTI_EDITOR_PLAN.md",
  "/FUTURE_FEATURES.md",
  "/EXPORTACION_Y_DISTRIBUCION.md",
  "/FEEDBACK_Y_AJUSTES.md",
  "/pyproject.toml",
  "/*.zip",
]
